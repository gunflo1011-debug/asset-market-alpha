name: backend-security-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  postgres-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Guard SECURITY DEFINER RPC baseline
        run: node scripts/check-security-definer-baseline.mjs
      - name: Verify Marketplace offer lifecycle contract
        run: node scripts/check-marketplace-offer-release-gate.mjs
      - name: Verify owner market-state migration contract
        run: node scripts/check-owner-market-state-migration.mjs
      - name: Verify numeric Marketplace location + established hardening gates
        run: node scripts/check-marketplace-location-number-release-gate.mjs
      - name: Verify Marketplace conversation privacy contract
        run: node scripts/check-marketplace-conversation-release-gate.mjs
      - name: Verify Marketplace reserve/sold lifecycle contract
        run: node scripts/check-marketplace-lifecycle-release-gate.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Start local Supabase
        run: supabase start
      - name: Rebuild database from migrations
        run: supabase db reset
      - name: Run pgTAP tests
        run: supabase test db
      - name: Lint database
        run: supabase db lint --level warning
      - name: Run real concurrency gate
        run: |
          bash scripts/concurrency_gate.sh
          bash scripts/marketplace_image_reservation_concurrency_gate.sh
