name: android-release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-alpha-apk.yml'
      - '.github/apk-build-request'
  workflow_dispatch:
    inputs:
      task:
        description: 'Choose what to run'
        required: true
        default: 'build-device-apk'
        type: choice
        options:
          - build-device-apk
          - build-store-aab
          - generate-lockfile

permissions:
  contents: read

jobs:
  generate-lockfile:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'generate-lockfile' }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify package lock
        shell: powershell
        run: |
          if (-not (Test-Path package-lock.json)) { throw 'package-lock.json was not generated' }
          if ((Get-Item package-lock.json).Length -eq 0) { throw 'package-lock.json is empty' }
      - name: Upload package lock
        uses: actions/upload-artifact@v4
        with:
          name: mobile-package-lock
          path: mobile/package-lock.json
          if-no-files-found: error
          retention-days: 1

  build-device-apk:
    if: ${{ github.event_name == 'push' || inputs.task == 'build-device-apk' }}
    runs-on: windows-latest
    env:
      NODE_ENV: production
      EXPO_PUBLIC_SUPABASE_URL: https://tfshblqsrczoekfsexrf.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_dTP4W0G3LHUhIN88wOk2PQ_w_GBXku3
    steps:
      - name: Enable Windows long paths
        shell: powershell
        run: git config --global core.longPaths true
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage mobile source at short path
        shell: powershell
        run: |
          $shortRoot = Join-Path $env:RUNNER_TEMP 'things-apk'
          if (Test-Path $shortRoot) { Remove-Item $shortRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $shortRoot | Out-Null
          Copy-Item -Path 'mobile\*' -Destination $shortRoot -Recurse -Force
          "MOBILE_BUILD_ROOT=$shortRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "Staged mobile build at $shortRoot"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify hosted Android SDK
        shell: powershell
        run: |
          $sdk = $env:ANDROID_SDK_ROOT
          if (-not $sdk) { $sdk = $env:ANDROID_HOME }
          if (-not $sdk -or -not (Test-Path $sdk)) { throw 'Android SDK not found on GitHub-hosted Windows runner' }
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "Using hosted Android SDK: $sdk"
      - name: Ensure package lock
        shell: powershell
        working-directory: ${{ env.MOBILE_BUILD_ROOT }}
        run: |
          if (-not (Test-Path package-lock.json)) { npm install --package-lock-only --ignore-scripts --no-audit --no-fund }
          if (-not (Test-Path package-lock.json)) { throw 'package-lock.json was not generated' }
          if ((Get-Item package-lock.json).Length -eq 0) { throw 'package-lock.json is empty' }
      - name: Install dependencies
        working-directory: ${{ env.MOBILE_BUILD_ROOT }}
        run: npm ci --include=dev --no-audit --no-fund
      - name: Reject client-side secrets
        working-directory: ${{ env.MOBILE_BUILD_ROOT }}
        run: npm run check:client-secrets
      - name: Validate production release configuration
        working-directory: ${{ env.MOBILE_BUILD_ROOT }}
        run: npm run check:release-config
      - name: Typecheck
        working-directory: ${{ env.MOBILE_BUILD_ROOT }}
        run: npm run typecheck
      - name: Generate native Android project
        working-directory: ${{ env.MOBILE_BUILD_ROOT }}
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean
      - name: Clean native Android build state
        shell: powershell
        working-directory: ${{ env.MOBILE_BUILD_ROOT }}
        run: |
          .\android\gradlew.bat --stop | Out-Null
          $paths = @('android/.cxx','android/app/.cxx','android/build','android/app/build','android/.gradle','node_modules/expo-modules-core/android/.cxx','node_modules/expo-modules-core/android/build')
          foreach ($path in $paths) { if (Test-Path $path) { Remove-Item -Path $path -Recurse -Force } }
      - name: Harden Gradle wrapper download
        shell: powershell
        working-directory: ${{ env.MOBILE_BUILD_ROOT }}
        run: |
          $wrapper = 'android/gradle/wrapper/gradle-wrapper.properties'
          if (-not (Test-Path $wrapper)) { throw 'gradle-wrapper.properties not found after Expo prebuild' }
          $content = Get-Content $wrapper -Raw
          $content = $content -replace 'gradle-([0-9.]+)-all\.zip', 'gradle-$1-bin.zip'
          if ($content -match '(?m)^networkTimeout=') { $content = $content -replace '(?m)^networkTimeout=.*$', 'networkTimeout=120000' } else { $content = $content.TrimEnd() + "`r`nnetworkTimeout=120000`r`n" }
          Set-Content -Path $wrapper -Value $content -Encoding ascii
      - name: Clean Gradle build
        shell: powershell
        working-directory: ${{ env.MOBILE_BUILD_ROOT }}\android
        run: .\gradlew.bat clean --no-daemon --max-workers=1 --no-watch-fs
      - name: Build device-test APK
        shell: powershell
        working-directory: ${{ env.MOBILE_BUILD_ROOT }}\android
        run: .\gradlew.bat assembleRelease --no-daemon --max-workers=1 --no-watch-fs
      - name: Verify device-test APK
        shell: powershell
        run: |
          $apk = Join-Path $env:MOBILE_BUILD_ROOT 'android\app\build\outputs\apk\release\app-release.apk'
          if (-not (Test-Path $apk)) { throw 'Release APK was not created' }
          if ((Get-Item $apk).Length -eq 0) { throw 'Release APK is empty' }
          Copy-Item $apk "$env:GITHUB_WORKSPACE\things-device-test.apk" -Force
          Write-Warning 'This APK is for device acceptance only. Expo prebuild signs the default release variant with the Android debug key unless store credentials are explicitly configured.'
      - name: Upload device-test APK
        uses: actions/upload-artifact@v4
        with:
          name: things-android-device-test-candidate
          path: things-device-test.apk
          if-no-files-found: error
          retention-days: 7

  build-store-aab:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'build-store-aab' }}
    runs-on: windows-latest
    env:
      NODE_ENV: production
      EXPO_PUBLIC_SUPABASE_URL: https://tfshblqsrczoekfsexrf.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_dTP4W0G3LHUhIN88wOk2PQ_w_GBXku3
      THINGS_ANDROID_KEYSTORE_BASE64: ${{ secrets.THINGS_ANDROID_KEYSTORE_BASE64 }}
      THINGS_ANDROID_KEY_ALIAS: ${{ secrets.THINGS_ANDROID_KEY_ALIAS }}
      THINGS_ANDROID_KEY_PASSWORD: ${{ secrets.THINGS_ANDROID_KEY_PASSWORD }}
      THINGS_ANDROID_STORE_PASSWORD: ${{ secrets.THINGS_ANDROID_STORE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Require Android store signing credentials
        shell: powershell
        run: |
          $required = @('THINGS_ANDROID_KEYSTORE_BASE64','THINGS_ANDROID_KEY_ALIAS','THINGS_ANDROID_KEY_PASSWORD','THINGS_ANDROID_STORE_PASSWORD')
          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) { throw "Missing required store-signing secret: $name" }
          }
      - name: Install dependencies
        working-directory: mobile
        run: npm ci --include=dev --no-audit --no-fund
      - name: Reject client-side secrets
        working-directory: mobile
        run: npm run check:client-secrets
      - name: Validate production release configuration
        working-directory: mobile
        run: npm run check:release-config
      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck
      - name: Generate native Android project
        working-directory: mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean
      - name: Configure upload-key signing
        shell: powershell
        working-directory: mobile
        run: |
          $keystorePath = Join-Path (Resolve-Path 'android/app') 'things-upload.keystore'
          [IO.File]::WriteAllBytes($keystorePath, [Convert]::FromBase64String($env:THINGS_ANDROID_KEYSTORE_BASE64))
          $gradleProperties = 'android/gradle.properties'
          Add-Content $gradleProperties "`nTHINGS_UPLOAD_STORE_FILE=things-upload.keystore"
          Add-Content $gradleProperties "THINGS_UPLOAD_KEY_ALIAS=$env:THINGS_ANDROID_KEY_ALIAS"
          Add-Content $gradleProperties "THINGS_UPLOAD_KEY_PASSWORD=$env:THINGS_ANDROID_KEY_PASSWORD"
          Add-Content $gradleProperties "THINGS_UPLOAD_STORE_PASSWORD=$env:THINGS_ANDROID_STORE_PASSWORD"
          $buildGradle = 'android/app/build.gradle'
          $content = Get-Content $buildGradle -Raw
          $releaseSigning = @'
              release {
                  if (!project.hasProperty('THINGS_UPLOAD_STORE_FILE')) {
                      throw new GradleException('Store signing credentials are required for release')
                  }
                  storeFile file(THINGS_UPLOAD_STORE_FILE)
                  storePassword THINGS_UPLOAD_STORE_PASSWORD
                  keyAlias THINGS_UPLOAD_KEY_ALIAS
                  keyPassword THINGS_UPLOAD_KEY_PASSWORD
              }
          '@
          if ($content -notmatch 'signingConfigs\s*\{[\s\S]*debug\s*\{') { throw 'Could not locate generated signingConfigs block' }
          $content = $content -replace '(signingConfigs\s*\{[\s\S]*?debug\s*\{[\s\S]*?\}\s*)', "`$1`r`n$releaseSigning`r`n"
          if ($content -notmatch 'release\s*\{[\s\S]*?signingConfig\s+signingConfigs\.debug') { throw 'Could not locate generated release debug-signing assignment' }
          $content = $content -replace '(release\s*\{[\s\S]*?)signingConfig\s+signingConfigs\.debug', '`$1signingConfig signingConfigs.release'
          Set-Content -Path $buildGradle -Value $content -Encoding utf8
      - name: Build store AAB
        shell: powershell
        working-directory: mobile\android
        run: .\gradlew.bat bundleRelease --no-daemon --max-workers=1 --no-watch-fs
      - name: Verify store AAB
        shell: powershell
        working-directory: mobile
        run: |
          $aab = 'android/app/build/outputs/bundle/release/app-release.aab'
          if (-not (Test-Path $aab)) { throw 'Release AAB was not created' }
          if ((Get-Item $aab).Length -eq 0) { throw 'Release AAB is empty' }
          $certOutput = (& keytool -printcert -jarfile $aab 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect AAB signing certificate' }
          if ($certOutput -match 'CN=Android Debug') { throw 'Store AAB is signed with the Android debug certificate' }
          Copy-Item $aab "$env:GITHUB_WORKSPACE\things-store-release.aab" -Force
      - name: Upload store AAB
        uses: actions/upload-artifact@v4
        with:
          name: things-android-store-release
          path: things-store-release.aab
          if-no-files-found: error
          retention-days: 7
