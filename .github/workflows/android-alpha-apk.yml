name: android-alpha-apk

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-alpha-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Reject client-side secrets
        run: npm run check:client-secrets
      - name: Validate hosted alpha configuration
        run: npm run check:alpha-config
      - name: Typecheck
        run: npm run typecheck
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Build release APK
        run: ./gradlew assembleRelease
        working-directory: mobile/android
      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: things-alpha-android-standalone
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
