name: android-alpha-apk

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Choose what to run'
        required: true
        default: 'build-apk'
        type: choice
        options:
          - build-apk
          - generate-lockfile

permissions:
  contents: read

jobs:
  generate-lockfile:
    if: ${{ inputs.task == 'generate-lockfile' }}
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify package lock
        shell: powershell
        run: |
          if (-not (Test-Path package-lock.json)) { throw 'package-lock.json was not generated' }
          if ((Get-Item package-lock.json).Length -eq 0) { throw 'package-lock.json is empty' }
      - name: Upload package lock
        uses: actions/upload-artifact@v4
        with:
          name: mobile-package-lock
          path: mobile/package-lock.json
          if-no-files-found: error
          retention-days: 1

  build-apk:
    if: ${{ inputs.task == 'build-apk' }}
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://tfshblqsrczoekfsexrf.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_dTP4W0G3LHUhIN88wOk2PQ_w_GBXku3
    steps:
      - name: Enable Windows long paths
        shell: powershell
        working-directory: .
        run: git config --global core.longPaths true
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure package lock
        shell: powershell
        run: |
          if (-not (Test-Path package-lock.json)) {
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          }
          if (-not (Test-Path package-lock.json)) { throw 'package-lock.json was not generated' }
          if ((Get-Item package-lock.json).Length -eq 0) { throw 'package-lock.json is empty' }
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Reject client-side secrets
        run: npm run check:client-secrets
      - name: Validate hosted alpha configuration
        run: npm run check:alpha-config
      - name: Typecheck
        run: npm run typecheck
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Clean native Android build state
        shell: powershell
        run: |
          $paths = @(
            'android/.cxx',
            'android/app/.cxx',
            'android/app/build',
            'node_modules/expo-modules-core/android/.cxx',
            'node_modules/expo-modules-core/android/build'
          )
          foreach ($path in $paths) {
            if (Test-Path $path) {
              Write-Output "Removing stale native build state: $path"
              Remove-Item -Path $path -Recurse -Force
            }
          }
      - name: Harden Gradle wrapper download
        shell: powershell
        run: |
          $wrapper = 'android/gradle/wrapper/gradle-wrapper.properties'
          if (-not (Test-Path $wrapper)) { throw 'gradle-wrapper.properties not found after Expo prebuild' }
          $content = Get-Content $wrapper -Raw
          $content = $content -replace 'gradle-([0-9.]+)-all\.zip', 'gradle-$1-bin.zip'
          if ($content -match '(?m)^networkTimeout=') {
            $content = $content -replace '(?m)^networkTimeout=.*$', 'networkTimeout=120000'
          } else {
            $content = $content.TrimEnd() + "`r`nnetworkTimeout=120000`r`n"
          }
          Set-Content -Path $wrapper -Value $content -Encoding ascii
      - name: Clean Gradle build
        shell: powershell
        run: .\gradlew.bat clean --no-daemon --max-workers=1
        working-directory: mobile/android
      - name: Build release APK
        shell: powershell
        run: |
          .\gradlew.bat assembleRelease --no-daemon --max-workers=1
          if ($LASTEXITCODE -eq 0) { exit 0 }

          Write-Output 'First native build failed. Clearing generated CMake/Ninja state once and retrying.'
          $retryPaths = @(
            'app/.cxx',
            'app/build',
            '../node_modules/expo-modules-core/android/.cxx',
            '../node_modules/expo-modules-core/android/build'
          )
          foreach ($path in $retryPaths) {
            if (Test-Path $path) { Remove-Item -Path $path -Recurse -Force }
          }
          .\gradlew.bat assembleRelease --no-daemon --max-workers=1
          exit $LASTEXITCODE
        working-directory: mobile/android
      - name: Verify release APK
        shell: powershell
        run: |
          $apk = 'android/app/build/outputs/apk/release/app-release.apk'
          if (-not (Test-Path $apk)) { throw 'Release APK was not created' }
          if ((Get-Item $apk).Length -eq 0) { throw 'Release APK is empty' }
      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: things-alpha-android-standalone
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
