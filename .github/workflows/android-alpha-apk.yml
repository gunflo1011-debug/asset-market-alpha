name: android-alpha-apk

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Choose what to run'
        required: true
        default: 'build-apk'
        type: choice
        options:
          - build-apk
          - generate-lockfile

permissions:
  contents: read

jobs:
  generate-lockfile:
    if: ${{ inputs.task == 'generate-lockfile' }}
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify package lock
        shell: powershell
        run: |
          if (-not (Test-Path package-lock.json)) { throw 'package-lock.json was not generated' }
          if ((Get-Item package-lock.json).Length -eq 0) { throw 'package-lock.json is empty' }
      - name: Upload package lock
        uses: actions/upload-artifact@v4
        with:
          name: mobile-package-lock
          path: mobile/package-lock.json
          if-no-files-found: error
          retention-days: 1

  build-apk:
    if: ${{ inputs.task == 'build-apk' }}
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Reject client-side secrets
        run: npm run check:client-secrets
      - name: Validate hosted alpha configuration
        run: npm run check:alpha-config
      - name: Typecheck
        run: npm run typecheck
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Build release APK
        shell: powershell
        run: .\gradlew.bat assembleRelease
        working-directory: mobile/android
      - name: Verify release APK
        shell: powershell
        run: |
          $apk = 'android/app/build/outputs/apk/release/app-release.apk'
          if (-not (Test-Path $apk)) { throw 'Release APK was not created' }
          if ((Get-Item $apk).Length -eq 0) { throw 'Release APK is empty' }
      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: things-alpha-android-standalone
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
