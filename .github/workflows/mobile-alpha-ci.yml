name: mobile-alpha-ci

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-alpha-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-alpha-ci.yml'

permissions:
  contents: read

jobs:
  mobile-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Reject client-side Supabase secrets
        run: npm run check:client-secrets
      - name: Verify Expo dependency compatibility
        run: npm run check:expo-deps
      - name: Typecheck strict TypeScript
        run: npm run typecheck
      - name: Validate capture flow regression
        run: npm run test:capture-flow
      - name: Validate barcode/QR capture privacy regression
        run: npm run test:barcode-capture-privacy
      - name: Validate capture completion surface regression
        run: npm run test:capture-completion-surface
      - name: Validate structured GTIN persistence wiring
        run: npm run test:structured-gtin-wiring
      - name: Validate GTIN Market Value source mapping
        run: node scripts/check-market-value-source-mapping.mjs
      - name: Validate inventory CRUD surface regression
        run: npm run test:inventory-crud-surface
      - name: Validate inventory value regression
        run: npm run test:inventory-value
      - name: Validate inventory value surface regression
        run: npm run test:inventory-value-surface
      - name: Validate value-to-sell regression
        run: npm run test:value-to-sell
      - name: Validate sale-start surface regression
        run: npm run test:sale-start-surface
      - name: Validate sale-start app integration regression
        run: npm run test:sale-start-app-integration
      - name: Validate final sale price regression
        run: npm run test:final-sale-price
      - name: Validate Marketplace offer mobile data contract
        run: npm run test:marketplace-offer-mobile-data
      - name: Validate Marketplace discovery privacy/search contract
        run: npm run test:marketplace-discovery-contract
      - name: Validate authenticated product convergence regression
        run: npm run test:product-convergence
      - name: Validate sold-state regression
        run: npm run test:sold-state
      - name: Validate sold-item trust surface regression
        run: npm run test:sold-item-surface
      - name: Validate owned inventory lifecycle regression
        run: npm run test:owned-inventory-lifecycle
      - name: Validate release-critical ownership and auth redirects
        run: npm run test:release-critical-contracts
      - name: Validate activation-event regression
        run: npm run test:activation-events
      - name: Validate activation-funnel regression
        run: npm run test:activation-funnel
      - name: Validate local activation collector regression
        run: npm run test:local-activation-collector
      - name: Validate activation action bridge regression
        run: npm run test:activation-action-bridge
      - name: Validate activation summary regression
        run: npm run test:activation-summary
      - name: Validate activation app transitions regression
        run: npm run test:activation-app-transitions
      - name: Validate activation debug surface regression
        run: npm run test:activation-debug-surface
      - name: Validate real app activation wiring
        run: npm run test:activation-real-app-wiring
      - name: Validate closed-alpha mobile configuration
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npm run check:alpha-config
      - name: Export Android bundle smoke build
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npx expo export --platform android --output-dir dist-ci
