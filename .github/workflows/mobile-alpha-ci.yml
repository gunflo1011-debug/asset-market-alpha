name: mobile-alpha-ci

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-alpha-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-alpha-ci.yml'

permissions:
  contents: read

jobs:
  mobile-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Reject client-side Supabase secrets
        run: npm run check:client-secrets
      - name: Verify Expo dependency compatibility
        run: npm run check:expo-deps
      - name: Typecheck strict TypeScript
        run: npm run typecheck
      - name: Validate closed-alpha mobile configuration
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npm run check:alpha-config
      - name: Export Android bundle smoke build
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npx expo export --platform android --output-dir dist-ci
